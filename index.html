<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10121a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Tamagotchi Elon Man</title>
  <meta name="description" content="Prends soin d'Elon Man, le petit robot de bureau. Un jeu PC17.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preload" href="fonts/PressStart2P.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Rubik-var.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: "Press Start 2P"; src: url(fonts/PressStart2P.woff2) format("woff2"); font-display: swap; }
    @font-face { font-family: "Rubik"; src: url(fonts/Rubik-var.woff2) format("woff2"); font-weight: 500 700; font-display: swap; }
    html, body { margin: 0; height: 100%; background: #10121a; overflow: hidden; overscroll-behavior: none; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #safe { position: fixed; inset: 0; box-sizing: border-box;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #game { width: 100%; height: 100%; }
    #game canvas { display: block; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #f2b01e;
      font: 16px "Press Start 2P", monospace; background: #10121a; z-index: 5; }
  </style>
</head>
<body>
  <div id="safe"><div id="game"></div></div>
  <div id="boot">Chargement…</div>
  <noscript><p style="color:#fff;font:16px sans-serif;padding:24px">Ce jeu a besoin de JavaScript.</p></noscript>
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
